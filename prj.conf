# nRF5340 Audio
CONFIG_NRF5340_AUDIO=y
CONFIG_SAMPLE_RATE_CONVERTER=y
CONFIG_SAMPLE_RATE_CONVERTER_FILTER_SIMPLE=y

# General
CONFIG_DEBUG=y
CONFIG_DEBUG_INFO=y
CONFIG_ASSERT=y
CONFIG_STACK_USAGE=y
CONFIG_THREAD_RUNTIME_STATS=y
CONFIG_STACK_SENTINEL=y
CONFIG_INIT_STACKS=y
CONFIG_BT=y
CONFIG_TRANSPORT_BIS=y

# Uart driver
CONFIG_SERIAL=y

# Logging
CONFIG_LOG=y
CONFIG_NEWLIB_LIBC_FLOAT_PRINTF=y
CONFIG_LOG_TAG_MAX_LEN=2
CONFIG_LOG_TAG_DEFAULT="--"
CONFIG_LOG_BACKEND_UART=y
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_LOG_DEFAULT_LEVEL=3  

#CONFIG_LOG_DEFAULT_LEVEL=4
# Use this for debugging thread usage
CONFIG_LOG_THREAD_ID_PREFIX=y

# Console related defines
CONFIG_CONSOLE=y
CONFIG_RTT_CONSOLE=y
CONFIG_UART_CONSOLE=y

# Shell related defines
CONFIG_SHELL=y
CONFIG_KERNEL_SHELL=y
CONFIG_USE_SEGGER_RTT=y
## Disable logs on RTT
CONFIG_SHELL_RTT_INIT_LOG_LEVEL_NONE=y
CONFIG_SHELL_BACKEND_RTT=y
CONFIG_SHELL_BACKEND_SERIAL=n
CONFIG_SHELL_VT100_COMMANDS=y
CONFIG_SHELL_VT100_COLORS=y
CONFIG_SHELL_STACK_SIZE=4096
CONFIG_SHELL_CMD_BUFF_SIZE=128
## Reduce shell memory usage
CONFIG_SHELL_WILDCARD=n
CONFIG_SHELL_HELP_ON_WRONG_ARGUMENT_COUNT=n
CONFIG_SHELL_STATS=n
CONFIG_SHELL_CMDS=n
CONFIG_SHELL_HISTORY=y

# Turn off default shell commands
CONFIG_I2C_SHELL=n
CONFIG_HWINFO_SHELL=n
CONFIG_CLOCK_CONTROL_NRF_SHELL=n
CONFIG_FLASH_SHELL=n
CONFIG_DEVICE_SHELL=n


# Suppress LOG_ERR messages from sd_check_card_type. Because SPI_SDHC has no card presence method,
# assume card is in slot. Thus error message is always shown if card is not inserted
CONFIG_SD_LOG_LEVEL_OFF=y

# Suppress LOG_INF messages from hci_core
CONFIG_BT_HCI_CORE_LOG_LEVEL_WRN=y
 
#added configs  

#for using onboard microphone 
# CONFIG_AUDIO_SOURCE_I2S=n
# CONFIG_AUDIO_SOURCE_PDM=n
# CONFIG_AUDIO_SOURCE_USB=y

#encryption
CONFIG_BT_AUDIO_BROADCAST_ENCRYPTED=y
CONFIG_BT_AUDIO_BROADCAST_ENCRYPTION_KEY="testkey"

# Disable random Broadcast_ID generation
CONFIG_BT_AUDIO_USE_BROADCAST_ID_RANDOM=n
# Set a fixed 24-bit Broadcast ID (e.g., 0x123456)
CONFIG_BT_AUDIO_BROADCAST_ID_FIXED=0x123456

CONFIG_BT_AUDIO_USE_BROADCAST_NAME_ALT=y
CONFIG_BT_AUDIO_BROADCAST_NAME_ALT="BIG2"
   
CONFIG_BT_ISO_MAX_CHAN=10
CONFIG_BT_BAP_BROADCAST_SNK_STREAM_COUNT=10
#CONFIG_BT_AUDIO_BROADCAST_SNK_STREAM_COUNT=4
#CONFIG_BT_BAP_BROADCAST_SNK_COUNT=2
CONFIG_BT_PER_ADV_SYNC_MAX=10
#CONFIG_BT_ISO_TX_BUF_COUNT=16
# CONFIG_BT_ISO_TX_FRAG_COUNT=4
CONFIG_BT_ISO_MAX_BIG=2
CONFIG_AUDIO_DATAPATH_STACK_SIZE=40000

# CONFIG_FIFO_TX_FRAME_COUNT=16

CONFIG_MAIN_STACK_SIZE=2800
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=3200

CONFIG_MONO_TO_ALL_RECEIVERS=y
#CONFIG_I2S_SAMPLES_NUM=4 
#CONFIG_I2S_CH_NUM=4


CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_DEBUG_THREAD_INFO=y
CONFIG_MEM_SLAB_TRACE_MAX_UTILIZATION=y

CONFIG_THREAD_ANALYZER=y
CONFIG_THREAD_ANALYZER_USE_PRINTK=y
CONFIG_THREAD_ANALYZER_AUTO=y
CONFIG_THREAD_ANALYZER_AUTO_INTERVAL=5

CONFIG_BUTTON_PUBLISH_STACK_SIZE=864


